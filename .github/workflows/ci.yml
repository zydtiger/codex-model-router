# Minimal single-version baseline. Add a matrix or artifact smoke test only when
# the repository's support and distribution contracts require them.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go from module metadata
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false # Enable when the project carries go.sum.

      - name: Select exact development toolchain
        shell: bash
        run: |
          toolchain=$(awk '$1 == "toolchain" { print $2 }' go.mod)
          [[ "$toolchain" =~ ^go[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "GOTOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Run commit-stage hooks
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: "0.4.x"

      - name: Run push-stage hooks
        uses: j178/prek-action@4e14d07f9231acabce116ccfca13b13dd9755ece # v3.0.0
        with:
          prek-version: "0.4.x"
          extra-args: --all-files --hook-stage pre-push
